<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dataset - Circuit Scanner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
  <a class="voltar" href="index.html">← Voltar para projetos</a>
  <section class="card">
    
    <h1>Dataset de símbolos</h1>
   

    <div id="resumo-dataset" class="dataset-resumo">Carregando...</div>

    <label for="tamanho-dataset">Quantidade por classe</label>
    <select id="tamanho-dataset" class="select-campo">
      <option value="12">Teste rápido — 12 por classe</option>
      <option value="60" selected>Base inicial — 60 por classe</option>
      <option value="150">Recomendado — 150 por classe</option>
      <option value="250">Ampliado — 250 por classe</option>
    </select>

    <button id="botao-gerar" type="button">Gerar / recriar dataset</button>
    <p id="status-dataset" class="status"></p>
  </section>

  <section class="card">

    <h2>Biblioteca suportada</h2>
    <div id="classes-grid" class="classes-grid"></div>
  </section>

  <section class="card">

    <h2>Catálogo visual</h2>
    
    <img id="catalogo" class="preview" alt="Catálogo de símbolos sintéticos">
  </section>

  <section class="card">
    
  </section>
</main>
<script src="js/dataset.js"></script>
</body>
</html>
